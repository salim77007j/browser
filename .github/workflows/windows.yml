name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      MOZTOOLS_PATH: ${{ github.workspace }}\dependencies\moztools\4.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (clang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Install NASM
        run: choco install nasm -y --no-progress

      - name: Download moztools (MozillaBuild for SpiderMonkey)
        run: |
          $url = "https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip"
          Invoke-WebRequest -Uri $url -OutFile moztools.zip
          Expand-Archive -Path moztools.zip -DestinationPath moztools-x
          New-Item -ItemType Directory -Force -Path dependencies\moztools\4.0 | Out-Null
          Copy-Item moztools-x\moztools-4.0\* dependencies\moztools\4.0\ -Recurse -Force
          Get-ChildItem dependencies\moztools\4.0 | Select-Object -First 8

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      - name: Test core
        run: cargo test -p kestrel-core

      - name: Build shell (release)
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: cargo build --release -p kestrel-shell

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\resources | Out-Null
          Copy-Item target\release\kestrel.exe dist\
          Copy-Item shell\resources\*.txt dist\resources\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath kestrel-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-windows
          path: kestrel-windows.zip
          retention-days: 30
