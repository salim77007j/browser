name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev cmake pkg-config python3 \
            autoconf2.13 \
            libfontconfig1-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            nasm zip unzip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: Test core
        run: cargo test -p kestrel-core --locked || cargo test -p kestrel-core

      - name: Build shell (release)
        run: cargo build --release -p kestrel-shell

      - name: Package
        run: |
          mkdir -p dist/resources
          cp target/release/kestrel dist/
          cp shell/resources/*.txt dist/resources/ || true
          cp shell/resources/*.desktop dist/resources/ || true
          cd dist
          zip -r ../kestrel-linux.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux
          path: kestrel-linux.zip
          retention-days: 30
