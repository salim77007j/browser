[package]
name = "kestrel-core"
version = "1.0.0"
edition = "2021"
description = "Kestrel Browser core: adblock engine, privacy engine, storage (Rust)"
license = "MIT"

[lib]
name = "kestrel_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
adblock = { version = "0.9", default-features = false, features = ["full-regex-handling", "object-pooling", "embedded-domain-resolver"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rmp 0.8.15 removed free fns that rmp-serde 0.15.x calls; pin the working release
rmp = "=0.8.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
